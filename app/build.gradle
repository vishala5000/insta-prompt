plugins { id 'com.android.application' }

android {
    namespace 'com.insta.prompt'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.insta.prompt'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file('insta.p12')
            storeType 'PKCS12'
            storePassword 'instaprompt'
            keyAlias 'insta'
            keyPassword 'instaprompt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
